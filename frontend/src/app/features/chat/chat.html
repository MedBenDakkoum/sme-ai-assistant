<div class="flex flex-col h-screen bg-gray-100">

  <!-- Header -->
  <header class="bg-white shadow px-6 py-4">
    <h1 class="text-xl font-semibold text-gray-800">Assistant IA PME</h1>
    <p class="text-sm text-gray-500">Réponses basées uniquement sur vos documents</p>
  </header>

  <!-- Messages -->
  <div class="flex-1 overflow-y-auto p-6 space-y-4">
    @for (message of messages; track $index) {
      <div class="flex" [class.justify-end]="message.role === 'user'">
        <div
          class="max-w-2xl px-4 py-3 rounded-2xl"
          [class.bg-blue-600]="message.role === 'user'"
          [class.text-white]="message.role === 'user'"
          [class.bg-white]="message.role === 'assistant'"
          [class.text-gray-800]="message.role === 'assistant'"
          [class.shadow]="message.role === 'assistant'"
        >
          {{ message.content }}
        </div>
      </div>
    }

    @if (isLoading) {
      <div class="flex">
        <div class="bg-white shadow px-4 py-3 rounded-2xl text-gray-500">
          Réflexion en cours...
        </div>
      </div>
    }
  </div>

  <!-- Input -->
  <div class="bg-white border-t px-6 py-4">
    <div class="flex gap-3">
      <input
        type="text"
        [(ngModel)]="currentQuestion"
        (keyup.enter)="sendMessage()"
        placeholder="Posez votre question..."
        class="flex-1 border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        [disabled]="isLoading"
      />
      <button
        (click)="sendMessage()"
        [disabled]="isLoading || !currentQuestion.trim()"
        class="bg-blue-600 text-white px-6 py-3 rounded-xl hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Envoyer
      </button>
    </div>
  </div>

</div>
